name: Build, test and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.x
      - run: dotnet build AnugTools.slnx --configuration Release -warnaserror
      - run: dotnet test Tests/Tests.csproj --configuration Release --no-build
      - run: dotnet publish AzureFunctionBackend/AzureFunctionBackend.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/backend
      - name: Validate bundled .NET 11 worker
        shell: pwsh
        run: |
          $runtime = Get-Content artifacts/backend/AzureFunctionBackend.runtimeconfig.json -Raw | ConvertFrom-Json
          if ($runtime.runtimeOptions.tfm -ne 'net11.0') { throw 'Expected .NET 11 output.' }
          if (!($runtime.runtimeOptions.includedFrameworks | Where-Object { $_.name -eq 'Microsoft.NETCore.App' -and $_.version -match '^11\.\d+\.\d+$' })) { throw 'Expected a bundled .NET 11 GA runtime.' }
          foreach ($file in @('AzureFunctionBackend.exe', 'coreclr.dll')) {
            if (!(Test-Path "artifacts/backend/$file")) { throw "Missing self-contained worker file: $file" }
          }
      - run: dotnet publish BlazorApp/BlazorApp.csproj --configuration Release --no-restore --output artifacts/frontend
      - uses: actions/upload-artifact@v4
        with:
          name: deployment
          path: artifacts
          include-hidden-files: true
          retention-days: 7

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: deployment
          path: artifacts
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Configure host for the self-contained .NET 11 worker
        shell: pwsh
        run: |
          az functionapp config set --resource-group Anug-Tools --name AnugToolsBackend --net-framework-version v10.0 --use-32bit-worker-process false --output none
          if ($LASTEXITCODE -ne 0) { throw 'Failed to configure the Functions host.' }
          az functionapp config appsettings set --resource-group Anug-Tools --name AnugToolsBackend --settings FUNCTIONS_WORKER_RUNTIME=dotnet-isolated FUNCTIONS_EXTENSION_VERSION=~4 WEBSITE_USE_PLACEHOLDER_DOTNETISOLATED=0 --output none
          if ($LASTEXITCODE -ne 0) { throw 'Failed to configure the isolated worker.' }
      - name: Deploy Functions backend
        uses: Azure/functions-action@v1
        with:
          app-name: AnugToolsBackend
          package: artifacts/backend
      - name: Deploy Blazor static files to IIS
        uses: azure/webapps-deploy@v3
        with:
          app-name: AnugTools
          package: artifacts/frontend
      - name: Smoke test deployed endpoints
        shell: pwsh
        run: |
          foreach ($url in @('https://anugtools.azurewebsites.net/', 'https://anugtoolsbackend.azurewebsites.net/api/FunctionGetEvents')) {
            $response = Invoke-WebRequest -Uri $url -MaximumRetryCount 5 -RetryIntervalSec 10
            if ($response.StatusCode -ne 200) { throw "Smoke test failed: $url" }
          }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser smoke test tools
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install chromium
      - name: Verify live Blazor startup in Chromium
        run: node scripts/smoke-site.mjs
