name: Build, test and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build AnugTools.slnx --configuration Release -warnaserror
      - run: dotnet test Tests/Tests.csproj --configuration Release --no-build
      - run: dotnet publish AzureFunctionBackend/AzureFunctionBackend.csproj --configuration Release --no-restore --output artifacts/backend
      - run: dotnet publish BlazorApp/BlazorApp.csproj --configuration Release --no-restore --output artifacts/frontend
      - uses: actions/upload-artifact@v4
        with:
          name: deployment
          path: artifacts
          include-hidden-files: true
          retention-days: 7

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: deployment
          path: artifacts
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy Functions backend
        uses: Azure/functions-action@v1
        with:
          app-name: AnugToolsBackend
          package: artifacts/backend
      - name: Deploy Blazor static files to IIS
        uses: azure/webapps-deploy@v3
        with:
          app-name: AnugTools
          package: artifacts/frontend
      - name: Smoke test deployed endpoints
        shell: pwsh
        run: |
          foreach ($url in @('https://anugtools.azurewebsites.net/', 'https://anugtoolsbackend.azurewebsites.net/api/FunctionGetEvents')) {
            $response = Invoke-WebRequest -Uri $url -MaximumRetryCount 5 -RetryIntervalSec 10
            if ($response.StatusCode -ne 200) { throw "Smoke test failed: $url" }
          }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser smoke test tools
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install chromium
      - name: Verify live Blazor startup in Chromium
        run: node scripts/smoke-site.mjs
